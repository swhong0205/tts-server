// ============================================================
// sherpa-onnx 한국어 TTS PoC - Gradle 빌드 설정
// Java 17 / Gradle 8.x / Shadow (Fat) JAR
//
// sherpa-onnx 는 Maven Central 미배포 → GitHub Releases 에서
// 직접 다운로드한 JAR / .so 파일을 libs/ 디렉터리에 배치하여 사용
// ============================================================

plugins {
    id 'java'
    id 'application'
    // Fat JAR(Uber JAR) 생성을 위한 Shadow 플러그인
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group   = 'com.example.tts'
version = '1.0.0'

// Java 17 소스/타겟 호환성 (JDK 21 이상에서도 컴파일 가능)
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 실행 진입점 설정
application {
    mainClass = 'com.example.tts.SherpaTtsPoc'
}

repositories {
    mavenCentral()
}

dependencies {
    // -------------------------------------------------------
    // sherpa-onnx Java API JAR (로컬 파일 의존성)
    //
    // 빌드 방법: sherpa-onnx v1.13.2 소스의 sherpa-onnx/java-api 를 javac 로 컴파일
    //   (v1.13.2부터 standalone jar 미배포 → 소스 컴파일 필요)
    //
    // libs/ 디렉터리에 다음 파일이 있어야 합니다:
    //   libs/sherpa-onnx-java17.jar         ← Java API (JNI 스텁)
    //   libs/libsherpa-onnx-jni.so          ← 네이티브 JNI 라이브러리
    //   libs/libonnxruntime.so              ← ONNX Runtime 공유 라이브러리
    // -------------------------------------------------------
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// -------------------------------------------------------
// Shadow (Fat) JAR 설정
// Java API JAR 를 단일 실행 가능 JAR 로 패키징
// (네이티브 .so 파일은 JAR 외부에 위치 → java.library.path 로 지정)
// -------------------------------------------------------
shadowJar {
    archiveBaseName.set('tts-poc')
    archiveClassifier.set('')   // '-all' 접미사 제거
    archiveVersion.set('')      // 버전 접미사 제거 → tts-poc.jar

    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Built-By'  : 'Gradle Shadow Plugin'
        )
    }

    // ServiceLoader SPI 파일 병합 (META-INF/services 충돌 방지)
    mergeServiceFiles()
}

// 기본 'build' 태스크가 shadowJar 를 포함하도록 연결
build.dependsOn shadowJar

// -------------------------------------------------------
// 로컬 실행 편의 태스크: ./gradlew run (또는 gradle run)
//
// 네이티브 .so 파일 로드를 위해 java.library.path 를 libs/ 로 지정
// JVM 이 libsherpa-onnx-jni.so, libonnxruntime.so 를 찾는 경로
// -------------------------------------------------------
run {
    // 네이티브 라이브러리 경로 (libs/ 폴더)
    jvmArgs "-Djava.library.path=${projectDir}/libs"

    // 기본 실행 파라미터 (커맨드라인 -D 옵션으로 오버라이드 가능)
    systemProperty 'model.dir',  System.getProperty('model.dir',  './vits-mms-kor')
    systemProperty 'tts.text',   System.getProperty('tts.text',   '안녕하세요. 셰르파 온넥스 한국어 TTS 테스트입니다.')
    systemProperty 'output.wav', System.getProperty('output.wav', './output.wav')
}
